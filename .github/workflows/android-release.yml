name: Android release

# Builds the signed APK and attaches it to a GitHub release.
#
# Triggered by pushing a tag like `v1.1.0`, or by hand from the Actions tab
# when you want a build without cutting a release.
#
# The signing key is never in this repository — it arrives from repository
# secrets and is written to the runner's disk for the length of one job. A
# release APK signed with the debug key (which is what this project did before)
# cannot update an install signed with any other key: Android refuses on a
# signature mismatch and the student sees only "App not installed".
#
# Secrets this needs, set under Settings → Secrets and variables → Actions:
#
#   ANDROID_KEYSTORE_BASE64   base64 of handy-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than "stable": a Flutter upgrade landing silently
          # between two releases is a debugging session nobody asked for.
          flutter-version: "3.32.4"
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/handy-release.jks"
          cat > mobile/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ runner.temp }}/handy-release.jks
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build APK
        working-directory: mobile
        # One universal APK rather than per-ABI splits. Students install this by
        # tapping a link on a phone, and "which of these four files is mine?"
        # is a worse problem than fifteen extra megabytes.
        run: flutter build apk --release

      - name: Verify it is not debug-signed
        working-directory: mobile
        # The failure this guards against is silent: a misconfigured job still
        # produces an installable APK, and nobody finds out it cannot be
        # updated until the next release will not install over it.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      - name: Name the file after the version
        id: rename
        working-directory: mobile
        # Two copies of the same APK, on purpose.
        #
        # handy-<version>.apk is what a person downloads and keeps: the version
        # is in the filename, so a phone's Downloads folder is not four
        # identical-looking files.
        #
        # handy.apk is the stable name, and it exists so that
        #   /releases/latest/download/handy.apk
        # is a permanent direct-download link. A versioned name cannot be
        # linked to from the website without editing the site on every release
        # — and the release that got forgotten is the link that 404s.
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "handy-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "handy.apk"
          echo "apk=mobile/handy-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: handy-apk
          path: ${{ steps.rename.outputs.apk }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.apk }}
          fail_on_unmatched_files: true
