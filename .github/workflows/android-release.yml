name: Release

# Builds the signed APK and the browser-extension zip, and attaches both to a
# GitHub release.
#
# Triggered by pushing a tag like `v1.1.0`, or by hand from the Actions tab
# when you want a build without cutting a release.
#
# The signing key is never in this repository — it arrives from repository
# secrets and is written to the runner's disk for the length of one job. A
# release APK signed with the debug key (which is what this project did before)
# cannot update an install signed with any other key: Android refuses on a
# signature mismatch and the student sees only "App not installed".
#
# Secrets this needs, set under Settings → Secrets and variables → Actions:
#
#   ANDROID_KEYSTORE_BASE64   base64 of handy-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned rather than "stable": a Flutter upgrade landing silently
          # between two releases is a debugging session nobody asked for.
          flutter-version: "3.32.4"
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/handy-release.jks"
          cat > mobile/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=${{ runner.temp }}/handy-release.jks
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Build APK
        working-directory: mobile
        # One universal APK rather than per-ABI splits. Students install this by
        # tapping a link on a phone, and "which of these four files is mine?"
        # is a worse problem than fifteen extra megabytes.
        run: flutter build apk --release

      - name: Verify it is not debug-signed
        working-directory: mobile
        # The failure this guards against is silent: a misconfigured job still
        # produces an installable APK, and nobody finds out it cannot be
        # updated until the next release will not install over it.
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is signed with the debug key."
            exit 1
          fi

      - name: Name the file after the version
        id: rename
        working-directory: mobile
        # Two copies of the same APK, on purpose.
        #
        # handy-<version>.apk is what a person downloads and keeps: the version
        # is in the filename, so a phone's Downloads folder is not four
        # identical-looking files.
        #
        # handy.apk is the stable name, and it exists so that
        #   /releases/latest/download/handy.apk
        # is a permanent direct-download link. A versioned name cannot be
        # linked to from the website without editing the site on every release
        # — and the release that got forgotten is the link that 404s.
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "handy-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "handy.apk"
          echo "apk=mobile/handy-$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack the extension
        # The website links to /releases/latest/download/handy-unpacked.zip,
        # so a release without this asset is a download button that 404s. It
        # was missing from every release until now because pack.mjs shelled
        # out to PowerShell and could not run on this runner at all.
        run: node extension/tool/pack.mjs

      - name: Verify the zip is loadable
        # Extract it and diff the result against what was staged.
        #
        # Checking the entry names instead was the obvious spelling and a
        # useless one: `unzip -Z1` rewrites separators as it prints, so a
        # name carrying a backslash — the exact corruption the old
        # PowerShell packer produced — comes back looking correct. Round
        # tripping the archive cannot be fooled that way. A backslash name
        # extracts as one flat file where a directory should be, and the
        # diff says so.
        #
        # It covers the rest of the ways this file goes wrong for free:
        # truncated entries, a missing manifest, anything the exclusion
        # filter let through. All of them are silent otherwise — a green
        # run that publishes a zip Chrome answers with nothing more useful
        # than "Manifest file is missing or unreadable".
        run: |
          unzip -qt dist-extension/handy-unpacked.zip
          # unzip only creates the last missing directory, so make the path first.
          mkdir -p "${{ runner.temp }}/zipcheck"
          unzip -q dist-extension/handy-unpacked.zip -d "${{ runner.temp }}/zipcheck"
          diff -r "${{ runner.temp }}/zipcheck/handy" dist-extension/handy
          test -f "${{ runner.temp }}/zipcheck/handy/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: handy-apk
          path: ${{ steps.rename.outputs.apk }}

      - uses: actions/upload-artifact@v4
        with:
          name: handy-extension
          path: dist-extension/handy-unpacked.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # All three, and only the first is the versioned keepsake. The other
          # two carry the stable names the website's two download buttons
          # resolve to — /releases/latest/download/handy.apk and
          # .../handy-unpacked.zip (see src/constants/download.ts). Building an
          # asset and forgetting to upload it is a green run that leaves one of
          # those buttons 404ing, which has now happened to both of them.
          files: |
            ${{ steps.rename.outputs.apk }}
            mobile/handy.apk
            dist-extension/handy-unpacked.zip
          fail_on_unmatched_files: true
