<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallback for browsers that don't take SVG favicons (Safari, older
         Edge), and the home-screen icon iOS uses when the PWA is installed.
         All three are generated by scripts/generate-app-icons.mjs. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />

    <!-- `/` serves two pages: the landing page to a visitor, the dashboard to a
         signed-in student. The metadata describes the landing page, since that
         is the only one a crawler or a link preview will ever see. -->
    <title>Handy — Attendance, timetable and deadlines for Aditya University</title>
    <meta
      name="description"
      content="Campus Connect gives you a percentage. Handy tells you what it means — how many classes you can miss, what a day off costs, and which subject is about to become a problem. Android app, home-screen widgets, and a web app."
    />
    <link rel="canonical" href="https://handy-aus.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Handy" />
    <meta property="og:url" content="https://handy-aus.vercel.app/" />
    <meta property="og:title" content="Handy — your attendance, with the answer attached" />
    <meta
      property="og:description"
      content="How many classes can you still miss? Handy works it out from your own Campus Connect data — on Android, on your home screen, and offline."
    />
    <meta property="og:image" content="https://handy-aus.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Handy — your attendance, with the answer attached" />
    <meta
      name="twitter:description"
      content="How many classes can you still miss? Handy works it out from your own Campus Connect data."
    />
    <meta name="twitter:image" content="https://handy-aus.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
